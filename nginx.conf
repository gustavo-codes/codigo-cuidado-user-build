# Este arquivo e um TEMPLATE: o entrypoint da imagem nginx:alpine roda envsubst
# e gera /etc/nginx/conf.d/nginx.conf (incluido dentro do http{} do nginx.conf
# da imagem base, que ja traz events{}, http{} e o mime.types).
# Por isso o conteudo aqui e apenas o bloco server.

server {
        # Porta vem do ambiente (envsubst no entrypoint da imagem nginx:alpine
        # processa /etc/nginx/templates/*.template). A Vercel injeta PORT em
        # runtime; fora dela (ex.: Coolify) defina PORT ou vale o fallback
        # ENV PORT=8080 do Dockerfile.
        listen ${PORT};
        root /usr/share/nginx/html;
        index index.html;

        # Revalida a cada uso: sem isso o Cloudflare aplica max-age=14400 (4h)
        # e serve build antigo depois de cada deploy.
        add_header Cache-Control "no-cache" always;

        # Arquivos do Unity servidos DESCOMPRIMIDOS (mesmo nome .br, corpo
        # plano): o proxy da Vercel re-comprime qualquer resposta empilhando
        # por cima do Content-Encoding de origem, o que corrompia os .br.
        # Sem Content-Encoding, a borda comprime (ou nao) por conta propria e
        # o loader da Unity recebe o corpo plano que sabe ler.
        # Tipos literais de propósito: variavel no default_type chegava como
        # texto literal no header atraves do proxy do Coolify.
        # Cache imutavel de 1 ano: a versao do build vem na URL (?v=<tamanho
        # do data>), entao build novo = URL nova = cache novo.
        location ~ \.wasm\.br$ {
            types { }
            default_type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~ \.framework\.js\.br$ {
            types { }
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~ \.br$ {
            types { }
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Outros arquivos do build (loader.js): imutavel pela mesma razao.
        location ~ ^/Build/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # O navegador cacheia o script do SW pelo Cache-Control da resposta;
        # com max-age longo o Safari demora horas para perceber um SW novo.
        location = /ServiceWorker.js {
            add_header Cache-Control "no-cache" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
