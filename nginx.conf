events {}

http {
    include /etc/nginx/mime.types;

    # Tipo correto para cada arquivo Brotli do build da Unity.
    map $uri $unity_type {
        default                 application/octet-stream;
        ~\.wasm\.br$            application/wasm;
        ~\.framework\.js\.br$   application/javascript;
        ~\.loader\.js\.br$      application/javascript;
    }

    server {
        listen 8091;
        root /usr/share/nginx/html;
        index index.html;

        # Arquivos .br do Unity: diz ao navegador que o corpo é Brotli.
        location ~ \.br$ {
            default_type $unity_type;
            add_header Content-Encoding br;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
