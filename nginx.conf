events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 8091;
        root /usr/share/nginx/html;
        index index.html;

        # Revalida a cada uso: sem isso o Cloudflare aplica max-age=14400 (4h)
        # e serve build antigo depois de cada deploy.
        add_header Cache-Control "no-cache" always;

        # Arquivos .br do Unity: tipo correto por arquivo + corpo é Brotli.
        # Tipos literais de propósito: variavel no default_type chegava como
        # texto literal no header atraves do proxy do Coolify.
        # Cache imutavel de 1 ano: a versao do build vem na URL (?v=<tamanho
        # do data.br>), entao build novo = URL nova = cache novo.
        location ~ \.wasm\.br$ {
            types { }
            default_type application/wasm;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~ \.framework\.js\.br$ {
            types { }
            default_type application/javascript;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~ \.br$ {
            types { }
            default_type application/octet-stream;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Outros arquivos do build (loader.js): imutavel pela mesma razao.
        location ~ ^/Build/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
